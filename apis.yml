name: Amalfi Semiconductor
description: Amalfi Semiconductor was a fabless developer of high-performance CMOS radio frequency
  (RF) and mixed-signal semiconductors for cellular handsets. Its proprietary CMOS-based AdaptiveRF
  architecture delivered power amplifiers that extended battery life and talk time while reducing the
  size and cost of front-end cellular handset designs, shipping over 100 million CMOS power amplifiers.
  Battery Ventures led the company's $24M Series C in 2009, with further investment in 2012 alongside DCM
  and Globespan Capital Partners. Amalfi Semiconductor was acquired by RF Micro Devices (now part of Qorvo)
  in November 2012 for $47.5M in cash. The company is defunct as an independent entity and publishes no
  developer portal, documentation, or public API; this profile is retained for network and portfolio-graph
  completeness rather than API enrichment.
